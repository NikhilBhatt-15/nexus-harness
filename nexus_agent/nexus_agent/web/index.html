<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nexus-agent</title>
<style>
:root{
  --bg:#f6f6f3;--panel:#ffffff;--panel2:#fafaf8;--ink:#1c1c1a;--ink2:#4a4a45;--muted:#85847d;--line:#e6e5df;--line2:#efeee9;
  --accent:#2f6f5e;--accent2:#e6f0ec;--accent-ink:#fff;--user:#eef3f1;--code:#f2f1ec;--ok:#2e7d4f;--err:#b8432f;--warn:#a86b00;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);--r:12px;--mono:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#131312;--panel:#1b1b19;--panel2:#20201d;--ink:#ecebe5;--ink2:#c7c5bd;--muted:#8f8d85;--line:#2e2d29;--line2:#262522;
  --accent:#62b39b;--accent2:#1d2b26;--accent-ink:#0c1713;--user:#1f2a26;--code:#24231f;--ok:#6cc68f;--err:#ec8c78;--warn:#e0b45c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}}
:root[data-theme=dark]{--bg:#131312;--panel:#1b1b19;--panel2:#20201d;--ink:#ecebe5;--ink2:#c7c5bd;--muted:#8f8d85;--line:#2e2d29;--line2:#262522;
  --accent:#62b39b;--accent2:#1d2b26;--accent-ink:#0c1713;--user:#1f2a26;--code:#24231f;--ok:#6cc68f;--err:#ec8c78;--warn:#e0b45c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}
/* thin themed scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
button{font:inherit;color:inherit;cursor:pointer}input,textarea,select{font:inherit;color:inherit}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* sidebar */
#side{width:268px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:16px 16px 10px;font-weight:650;font-size:15px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:12px}
.btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 11px}
.btn:hover{background:var(--panel2)}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.side-pad{padding:0 12px}
.proj{position:relative;margin:6px 12px 6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);cursor:pointer}
.proj .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.proj .nm{font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:6px}
.proj .sub{font-size:12.5px;color:var(--muted)}
.menu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;padding:6px;display:none}
.menu.open{display:block}.menu .it{padding:7px 9px;border-radius:8px;display:flex;justify-content:space-between;gap:8px}
.menu .it:hover{background:var(--panel2)}.menu .it .m{color:var(--muted);font-size:12px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 16px 6px}
#chats{flex:1;overflow:auto;padding:0 8px 8px}
.chat{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 9px;font-size:13.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.chat:hover{background:var(--panel2)}.chat.cur{background:var(--accent2);color:var(--ink)}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.keys{display:flex;gap:4px;flex-wrap:wrap}.key{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.key.cool{color:var(--warn);border-color:var(--warn)}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 18px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .t{display:flex;align-items:center;gap:10px;min-width:0}.top .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--panel);white-space:nowrap}
#log{flex:1;overflow:auto;padding:28px 20px 12px}
.col{max-width:780px;margin:0 auto}
.u{display:flex;justify-content:flex-end;margin:6px 0 18px}.u div{background:var(--user);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap}
.a{margin:0 0 26px}.a .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.a .who .dot{width:20px;height:20px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:700}
.md p{margin:.45em 0}.md h3,.md h4,.md h5{margin:.9em 0 .3em}.md ul,.md ol{padding-left:22px;margin:.4em 0}
.md code{background:var(--code);padding:1px 5px;border-radius:5px;font-family:var(--mono);font-size:.9em}
.md pre{background:var(--code);padding:12px;border-radius:10px;overflow:auto;font-size:12.5px}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;margin:10px 0;font-size:13.5px;display:block;overflow:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left}.md th{background:var(--panel2);font-weight:600}
/* activity */
.act{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:4px 0 12px;overflow:hidden}
.act>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13.5px}
.act>summary::-webkit-details-marker{display:none}.act>summary .chev{transition:transform .15s}.act[open]>summary .chev{transform:rotate(90deg)}
.act .rows{border-top:1px solid var(--line2);padding:4px}
.row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.row:hover{background:var(--panel2)}.row .nm{font-family:var(--mono);font-weight:600;font-size:12.5px}
.row .arg{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:12px}
.row .ms{color:var(--muted);font-size:12px;white-space:nowrap}
.st{width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;color:#fff}
.st.run{border:2px solid var(--muted);border-top-color:transparent;animation:spin 1s linear infinite;background:none}
.st.ok{background:var(--ok)}.st.err{background:var(--err)}.st.deny{background:var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:12.5px;color:var(--muted);padding:3px 8px}.note.warn{color:var(--warn)}
.approve{border:1px solid var(--warn);border-radius:var(--r);padding:12px;margin:8px 0;background:var(--panel)}
.approve pre{background:var(--code);border-radius:8px;padding:8px;font-size:12px;max-height:220px;overflow:auto;font-family:var(--mono)}
.approve .acts{display:flex;gap:8px}
.foot{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}.foot.bad{color:var(--warn)}
.empty{text-align:center;margin-top:12vh;color:var(--muted)}.empty h2{color:var(--ink);font-weight:600;font-size:22px;margin:0 0 6px}
.sugg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:22px;text-align:left}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;color:var(--ink2);font-size:13.5px}
.sugg button:hover{border-color:var(--accent);color:var(--ink)}
/* composer */
.comp{flex:none;padding:10px 20px 18px}.box{max-width:780px;margin:0 auto;border:1px solid var(--line);background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:8px 8px 8px 14px;display:flex;align-items:flex-end;gap:8px}
.box textarea{flex:1;border:0;outline:none;resize:none;background:transparent;padding:6px 0;max-height:220px;min-height:24px}
.send{width:34px;height:34px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4;cursor:default}.send.stop{background:var(--ink);color:var(--bg)}
.hint{max-width:780px;margin:6px auto 0;font-size:11.5px;color:var(--muted);text-align:center}
/* inspector */
#insp{width:400px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#insp.hide{display:none}
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tab.on{color:var(--ink);border-color:var(--accent)}
#ibody{flex:1;overflow:auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:7px 8px}.stat b{display:block;font-size:15px}.stat span{font-size:11px;color:var(--muted)}
.ev{border-left:2px solid var(--line);margin-left:6px;padding:0 0 12px 14px;position:relative}
.ev:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--muted)}
.ev.tool:before{border-color:var(--accent)}.ev.err:before{border-color:var(--err)}.ev.model:before{border-color:var(--ink2)}.ev.warn:before{border-color:var(--warn)}
.ev .h{display:flex;justify-content:space-between;gap:8px;font-size:13px}.ev .h b{font-family:var(--mono);font-size:12.5px}
.ev .tm{color:var(--muted);font-size:11.5px;white-space:nowrap}
.ev .meta{font-size:12px;color:var(--muted);margin-top:2px}
.ev pre{background:var(--code);border-radius:8px;padding:8px;font-size:11.5px;font-family:var(--mono);overflow:auto;max-height:260px;margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.ev.focus{background:var(--accent2);border-radius:0 8px 8px 0}
.badge{font-size:11px;padding:0 6px;border-radius:6px;border:1px solid currentColor}
.badge.read{color:var(--ok)}.badge.write{color:var(--warn)}.badge.exec{color:var(--warn)}.badge.destructive{color:var(--err)}
.tset{border:1px solid var(--line);border-radius:10px;margin-bottom:10px}.tset h4{margin:0;padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line2)}
.tset .t{padding:6px 10px;font-size:12.5px;border-top:1px solid var(--line2)}.tset .t:first-of-type{border-top:0}
.tset .t .d{color:var(--muted);font-size:12px}
.tbl{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line2);font-size:13px}
.rel{font-family:var(--mono);font-size:12px;padding:4px 0;color:var(--ink2)}
/* connect modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
.dlg{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;font-size:16px}.dlg .bd{padding:18px 20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;margin-bottom:14px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--muted)}.seg button.on{background:var(--accent2);color:var(--ink)}
label.f{display:block;font-size:12.5px;color:var(--ink2);margin:12px 0 5px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;outline:none}
.inp:focus{border-color:var(--accent)}.small{font-size:12px;color:var(--muted);margin-top:4px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent2)}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13.5px}
.steps{display:grid;gap:6px;margin:4px 0 14px}.step{display:flex;align-items:center;gap:10px;font-size:13.5px}
.step .st{width:18px;height:18px}.step.wait{color:var(--muted)}.step.wait .st{border:2px solid var(--line);background:none}
.console{background:var(--code);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12px;max-height:220px;overflow:auto;white-space:pre-wrap}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.card{border:1px solid var(--line);border-radius:12px;padding:10px}
.card b{display:block;font-size:20px}.card span{font-size:12px;color:var(--muted)}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media (max-width:1100px){#insp{position:fixed;right:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow)}}
@media (max-width:760px){#side{display:none}#insp{width:100%}.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="dot">N</div>nexus-agent</div>
  <div class="side-pad"><button class="btn" style="width:100%" id="newChat"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button></div>
  <div class="proj" id="projBox">
    <div class="lbl">Project</div>
    <div class="nm"><span id="projName">—</span><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
    <div class="sub" id="projSub">no data connected</div>
    <div class="menu" id="projMenu"></div>
  </div>
  <div class="side-pad"><button class="btn ghost" style="width:100%" id="openConnect"><svg class="ico" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Connect data</button></div>
  <div class="sec">Chats</div>
  <div id="chats"></div>
  <div class="side-foot" id="sideFoot"></div>
</aside>
<main id="main">
  <div class="top">
    <div class="t"><b id="topTitle">New chat</b><span class="chip" id="topModel"></span><span class="chip" id="topMode"></span></div>
    <div style="display:flex;gap:6px">
      <button class="btn ghost sm" id="themeBtn" title="Theme"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="btn sm" id="inspBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Inspector</button>
    </div>
  </div>
  <div id="log"><div class="col" id="col"></div></div>
  <div class="comp">
    <div class="box"><textarea id="q" rows="1" placeholder="Ask anything about your data…"></textarea>
      <button class="send" id="send" title="Send"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
    <div class="hint">Enter to send · Shift+Enter for a new line · reads run freely, writes ask for approval</div>
  </div>
</main>
<aside id="insp">
  <div class="tabs"><button class="tab on" data-t="trace">Trace</button><button class="tab" data-t="tools">Tools</button><button class="tab" data-t="data">Data</button></div>
  <div id="ibody"></div>
</aside>

<div id="modal"><div class="dlg">
  <header><h3>Connect data</h3><button class="btn ghost sm" id="closeModal">✕</button></header>
  <div class="bd" id="mbody"></div>
</div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={project:null,projects:[],info:null,session:null,run:null,runs:{},busy:false,tab:'trace',focus:null};
try{const t=localStorage.getItem('nxa-theme');if(t)document.documentElement.dataset.theme=t;
    const ins=localStorage.getItem('nxa-insp');if(ins==='0'||(ins===null&&innerWidth<1100))$('#insp').classList.add('hide');}catch(e){}

function token(){try{return localStorage.getItem('nxa-token')||''}catch(e){return ''}}
function withTok(u){const t=token();return t?u+(u.includes('?')?'&':'?')+'token='+encodeURIComponent(t):u}
async function api(path,opts={}){
  const h={'Content-Type':'application/json',...(token()?{Authorization:'Bearer '+token()}:{}),...(opts.headers||{})};
  const r=await fetch(path,{...opts,headers:h});
  if(r.status===401){const t=prompt('This server needs an access token (NXA_SERVER_TOKEN):');
    if(t){try{localStorage.setItem('nxa-token',t)}catch(e){}return api(path,opts)}}
  if(!r.ok){let t=await r.text();try{t=JSON.parse(t).detail||t}catch(e){}throw new Error(t)}return r.json()}
function md(src){
  const blocks=[];src=String(src||'').replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{blocks.push(`<pre><code>${esc(c)}</code></pre>`);return `\u0000${blocks.length-1}\u0000`});
  const lines=src.split('\n'),out=[];let i=0;
  const inl=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|\W)\*([^*\n]+)\*/g,'$1<i>$2</i>');
  const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  while(i<lines.length){const l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      let h='<table><tr>'+row(l).map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>';i+=2;
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){h+='<tr>'+row(lines[i]).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>';i++}
      out.push(h+'</table>');continue}
    if(/^\s*[-*•] /.test(l)){let h='<ul>';while(i<lines.length&&/^\s*[-*•] /.test(lines[i])){h+=`<li>${inl(lines[i].replace(/^\s*[-*•] /,''))}</li>`;i++}out.push(h+'</ul>');continue}
    if(/^\s*\d+[.)] /.test(l)){let h='<ol>';while(i<lines.length&&/^\s*\d+[.)] /.test(lines[i])){h+=`<li>${inl(lines[i].replace(/^\s*\d+[.)] /,''))}</li>`;i++}out.push(h+'</ol>');continue}
    const m=l.match(/^(#{1,4}) (.*)/);if(m){out.push(`<h${m[1].length+2}>${inl(m[2])}</h${m[1].length+2}>`);i++;continue}
    if(!l.trim()){i++;continue}out.push(`<p>${inl(l)}</p>`);i++}
  return out.join('').replace(/\u0000(\d+)\u0000/g,(_,n)=>blocks[n]);
}
const fmtMs=ms=>ms==null?'':ms<1000?`${ms} ms`:`${(ms/1000).toFixed(1)} s`;
const argSummary=a=>{const s=JSON.stringify(a||{});return s.length>140?s.slice(0,140)+'…':s};

/* ---------------- projects / sidebar ---------------- */
async function loadProjects(select){
  S.projects=await api('/v1/projects');
  if(!S.projects.length){S.project=null;renderSide();renderEmpty();return}
  if(select)S.project=select;
  if(!S.project||!S.projects.find(p=>p.name===S.project)){try{S.project=localStorage.getItem('nxa-project')}catch(e){}
    if(!S.projects.find(p=>p.name===S.project))S.project=S.projects[0].name}
  try{localStorage.setItem('nxa-project',S.project)}catch(e){}
  S.info=await api('/v1/info?project='+encodeURIComponent(S.project)).catch(()=>null);
  renderSide();await loadChats();if(!S.session)renderEmpty();renderInsp();
}
function renderSide(){

function addUser(text){$('.empty')?.remove();const d=document.createElement('div');d.className='u';d.innerHTML=`<div>${esc(text)}</div>`;$('#col').appendChild(d);scroll()}
function newTurn(runId){$('.empty')?.remove();const d=document.createElement('div');d.className='a';d.dataset.run=runId||'';
  d.innerHTML=`<div class="who"><div class="dot">N</div>nexus</div><details class="act" open><summary><svg class="ico chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg><span class="sum">Working…</span></summary><div class="rows"></div></details><div class="md"></div><div class="foot"></div>`;
  $('#col').appendChild(d);scroll();return d}
function scroll(){const l=$('#log');if(l.scrollHeight-l.scrollTop-l.clientHeight<200)l.scrollTop=l.scrollHeight}
function toolRow(turn,ev){
  const r=document.createElement('div');r.className='row';r.dataset.id=ev.id;
  r.innerHTML=`<span class="st run"></span><span class="nm">${esc(ev.name)}</span><span class="arg">${esc(argSummary(ev.arguments))}</span><span class="ms"></span>`;
  r.onclick=()=>focusEvent(ev.id);turn.querySelector('.rows').appendChild(r);return r}
function setRow(turn,id,state,ms,extra){const r=turn.querySelector(`.row[data-id="${CSS.escape(id)}"]`);if(!r)return;
  const st=r.querySelector('.st');st.className='st '+state;st.textContent=state==='ok'?'✓':state==='err'?'!':state==='deny'?'–':'';
  r.querySelector('.ms').textContent=(extra?extra+' · ':'')+fmtMs(ms)}
function note(turn,html,cls){const n=document.createElement('div');n.className='note '+(cls||'');n.innerHTML=html;turn.querySelector('.rows').appendChild(n)}
function renderEvent(run,ev){
  const turn=run.turn;run.events.push(ev);
  switch(ev.type){
    case 'assistant': if(ev.text&&ev.tool_calls?.length)note(turn,esc(ev.text));break;
    case 'tool_call': toolRow(turn,ev);break;
    case 'tool_result': setRow(turn,ev.id,ev.ok?'ok':'err',ev.ms,ev.offloaded?'offloaded':'');break;
    case 'denied': {const rows=turn.querySelectorAll('.row');const last=rows[rows.length-1];if(last)setRow(turn,last.dataset.id,'deny',null,'denied');note(turn,'denied: '+esc(ev.reason),'warn');break}
    case 'plan': note(turn,'<b>Plan</b> '+ev.items.map((t,i)=>`${t.done?'✓':'○'} ${esc(t.step)}`).join(' · '));break;
    case 'retry': note(turn,`model busy — ${esc(ev.error)}${ev.wait_s?`, retrying in ${ev.wait_s}s`:''}`,'warn');break;
    case 'context_edit': note(turn,`cleared ${ev.cleared_tool_results} old tool results to save context`);break;
    case 'compaction': note(turn,`summarized ${ev.summarized_messages} earlier messages`);break;
    case 'done':{
      const n=turn.querySelectorAll('.row').length,secs=((ev.ts-run.t0)||0);
      turn.querySelector('.sum').textContent=n?`Worked for ${secs.toFixed(0)}s · ${ev.steps} steps · ${n} tool call${n>1?'s':''}`:`Answered in ${secs.toFixed(0)}s`;
      if(!n)turn.querySelector('.act').remove();else turn.querySelector('.act').open=false;
      turn.querySelector('.md').innerHTML=md(ev.text||'');
      const f=turn.querySelector('.foot');f.className='foot'+(ev.stop_reason==='done'?'':' bad');
      f.innerHTML=`<span>${ev.stop_reason==='done'?'✓ done':'⚠ '+esc(ev.stop_reason)}</span><span>$${(ev.cost_usd||0).toFixed(4)}</span>${ev.error?`<span>${esc(ev.error)}</span>`:''}`;
      break}
  }
  if(S.tab==='trace'&&S.run===run.id)renderInsp();scroll();
}
async function send(){
  const text=$('#q').value.trim();if(!text||S.busy||!S.project)return;
  $('#q').value='';autosize();S.busy=true;setSend();addUser(text);
  const turn=newTurn();
  let run;
  try{run=await api('/v1/runs',{method:'POST',body:JSON.stringify({task:text,project:S.project,session_id:S.session})})}
  catch(e){turn.querySelector('.md').innerHTML=`<p style="color:var(--err)">${esc(e.message)}</p>`;turn.querySelector('.act').remove();S.busy=false;setSend();return}
  S.session=run.session_id;S.run=run.id;const R={id:run.id,turn,events:[],t0:Date.now()/1000};S.runs[run.id]=R;turn.dataset.run=run.id;
  if(!$('#topTitle').textContent||$('#topTitle').textContent==='New chat')$('#topTitle').textContent=text.slice(0,70);
  pollApproval(R);
  await new Promise(res=>{const es=new EventSource(withTok(`/v1/runs/${run.id}/stream`));
    es.onmessage=m=>{const ev=JSON.parse(m.data);if(ev.type==='user'){R.t0=ev.ts;return}renderEvent(R,ev);if(ev.type==='done'){es.close();res()}};
    es.onerror=()=>{es.close();res()}});
  S.busy=false;setSend();loadChats();refreshInfo();$('#q').focus();
}
async function pollApproval(R){
  while(S.busy&&S.run===R.id){
    try{const r=await api(`/v1/runs/${R.id}`);const p=r.pending_approval;
      if(p&&!R.turn.querySelector('.approve[data-live]')){
        const d=document.createElement('div');d.className='approve';d.dataset.live='1';
        d.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px"><b>Allow ${esc(p.tool)}?</b><span class="badge ${esc(p.risk)}">${esc(p.risk)}</span></div>
          ${p.reasons?.length?`<div class="note warn" style="padding:0 0 6px">${esc(p.reasons.join('; '))}</div>`:''}
          <pre>${esc(p.arguments.code||JSON.stringify(p.arguments,null,1))}</pre><div class="acts"><button class="btn primary sm">Allow</button><button class="btn sm">Deny</button></div>`;
        R.turn.querySelector('.act').after(d);
        const answer=async allow=>{d.querySelectorAll('button').forEach(b=>b.disabled=true);d.removeAttribute('data-live');
          d.querySelector('b').textContent=(allow?'Allowed ':'Denied ')+p.tool;await api(`/v1/runs/${R.id}/approve`,{method:'POST',body:JSON.stringify({allow})}).catch(()=>{});
          setTimeout(()=>d.remove(),1200)};
        const [y,n]=d.querySelectorAll('button');y.onclick=()=>answer(true);n.onclick=()=>answer(false);scroll();
      }}catch(e){}
    await new Promise(r=>setTimeout(r,700));
  }
}

async function openSession(id){
  S.session=id;S.run=null;$('#col').innerHTML='';
  const msgs=await api(`/v1/sessions/${id}/messages`);const results={};
  msgs.filter(m=>m.role==='tool').forEach(m=>results[m.tool_call_id]=m);
  let turn=null;const hist={id:'hist',events:[],turn:null,t0:0};
  for(const m of msgs){
    if(m.role==='user'){addUser(m.content);turn=null}
    else if(m.role==='assistant'){
      if(!turn){turn=newTurn();turn.querySelector('.sum').textContent='Tool calls';hist.turn=turn}
      for(const c of m.tool_calls||[]){let args={};try{args=JSON.parse(c.function.arguments||'{}')}catch(e){}
        const ev={type:'tool_call',id:c.id,name:c.function.name,arguments:args};toolRow(turn,ev);hist.events.push(ev);
        const r=results[c.id];if(r){const ok=!String(r.content).startsWith('Error')&&!String(r.content).startsWith('Permission denied');
          setRow(turn,c.id,ok?'ok':'err',null,'');hist.events.push({type:'tool_result',id:c.id,name:r.name,ok,preview:String(r.content).slice(0,3000),chars:String(r.content).length})}}
      if(m.content&&!(m.tool_calls||[]).length){turn.querySelector('.md').innerHTML=md(m.content);
        const n=turn.querySelectorAll('.row').length;if(!n)turn.querySelector('.act').remove();else{turn.querySelector('.act').open=false;turn.querySelector('.sum').textContent=`${n} tool call${n>1?'s':''}`}
        turn=null}
    }
  }
  S.runs.hist=hist;S.run='hist';$('#topTitle').textContent=(msgs.find(m=>m.role==='user')?.content||'Chat').slice(0,70);
  loadChats();renderInsp();$('#log').scrollTop=$('#log').scrollHeight;
}

    if(CM.mode==='upload'){if(!CM.files.length)throw new Error('add some files first');
      const batch=Math.random().toString(36).slice(2,12);let folder='';
      for(const f of CM.files){say(`uploading ${f.name} (${(f.size/1e6).toFixed(1)} MB)…`);
        const r=await fetch(withTok(`/v1/uploads?name=${encodeURIComponent(f.name)}&batch=${batch}`),{method:'POST',body:f});
        if(!r.ok)throw new Error(await r.text());folder=(await r.json()).folder}
      source=folder}
    if(!source)throw new Error('enter a database URL, file or folder');
    const job=await api('/v1/projects/connect',{method:'POST',body:JSON.stringify({source,name:CM.name,dictionary:CM.dict||null,describe_model:CM.describe?(S.info?.model||null):null})});
    let shown=0;
    while(true){const j=await api('/v1/jobs/'+job.id);for(;shown<j.log.length;shown++)say(j.log[shown]);steps(Math.max(1,j.step));
      if(j.status==='done'){steps(8);showResult(j);break}
      if(j.status==='failed')throw new Error(j.error);
      await new Promise(r=>setTimeout(r,800))}
  }catch(e){say('ERROR: '+e.message);$('#cResult').innerHTML=`<div class="row2"><button class="btn" onclick="renderConnectForm()">Back</button></div>`}
}
function showResult(j){const s=j.summary;const t=Object.keys(s.tables||{});
  $('#cResult').innerHTML=`<div class="cards"><div class="card"><b>${t.length}</b><span>tables · ${Object.values(s.tables).reduce((a,b)=>a+b,0).toLocaleString()} rows</span></div>
    <div class="card"><b>${s.relations.length}</b><span>joins discovered</span></div><div class="card"><b>${s.self_check.passed}/${s.self_check.checks}</b><span>knowledge self-check</span></div></div>
    <div class="row2"><button class="btn primary" id="cOpen">Start chatting</button></div>`;
  $('#cOpen').onclick=async()=>{$('#modal').classList.remove('open');CM={mode:'path',files:[]};S.session=null;await loadProjects(j.name);renderEmpty()}}

$('#projSub').textContent='loading…';$('#col').innerHTML='<div class="empty"><div>Loading…</div></div>';
loadProjects().then(()=>{setSend();renderInsp()}).catch(e=>{
  $('#col').innerHTML=`<div class="empty"><h2>Can't reach the server</h2><div>${esc(e.message)}</div><div style="margin-top:14px"><button class="btn" style="display:inline-flex" onclick="location.reload()">Retry</button></div></div>`});
</script>
</body>
</html>
