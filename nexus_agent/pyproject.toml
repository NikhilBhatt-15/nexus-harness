[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-agent"
version = "0.1.0"
description = "A general agent harness: any LLM, attach/detach toolsets (files, shell, web, databases, HTTP APIs, MCP, nexus-lite knowledge), sessions, permissions, CLI/SDK/HTTP, and an eval runner."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "litellm>=1.80",
    "httpx>=0.24",
    "rich>=13",
    "docstring-parser>=0.16",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pyyaml>=6",
    "pandas>=2",
    "numpy>=1.24",
]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
knowledge = ["nexus-lite"]
sql = ["sqlalchemy>=2"]

[project.scripts]
nxa = "nexus_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nexus_agent"]
